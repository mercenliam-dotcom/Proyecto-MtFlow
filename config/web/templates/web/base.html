{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MtFlow{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'web/css/styles.css' %}">
</head>
<body>
    <aside class="sidebar">
        <a class="brand" href="{% url 'web:portafolio' %}">
            MtFlow
            <span>TATTOO STUDIO</span>
        </a>

       <nav class="navigation" aria-label="Navegación principal">
        <a class="nav-item {% if request.resolver_match.url_name == 'portafolio' %}active{% endif %}"
        href="{% url 'web:portafolio' %}"
        {% if request.resolver_match.url_name == 'portafolio' %}aria-current="page"{% endif %}>
        <span aria-hidden="true">▧</span>
        Portafolio
        </a>

        <a class="nav-item {% if request.resolver_match.url_name == 'horarios' %}active{% endif %}"
       href="{% url 'web:horarios' %}"
       {% if request.resolver_match.url_name == 'horarios' %}aria-current="page"{% endif %}>
        <span aria-hidden="true">◷</span>
        Horarios
        </a>

        <a class="nav-item {% if request.resolver_match.url_name == 'cotizacion' %}active{% endif %}"
        href="{% url 'web:cotizacion' %}"
        {% if request.resolver_match.url_name == 'cotizacion' %}aria-current="page"{% endif %}>
        <span aria-hidden="true">▤</span> Cotizaciones
        </a>
        </nav>

        <div class="sidebar-footer">
            <span class="status-dot"></span>
            Tu próxima idea empieza aquí
        </div>
    </aside>

    <main class="main-panel">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
