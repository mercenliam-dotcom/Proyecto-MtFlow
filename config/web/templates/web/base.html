{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MtFlow{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'web/css/styles.css' %}">
</head>
<body>
    <aside class="sidebar">
        <a class="brand" href="{% url 'web:portafolio' %}">
            MtFlow
            <span>TATTOO STUDIO</span>
        </a>

        <nav class="navigation" aria-label="Navegación principal">
            <a class="nav-item active"
               href="{% url 'web:portafolio' %}"
               aria-current="page">
                <span aria-hidden="true">▧</span> Portafolio
            </a>

            <button class="nav-item" disabled>
                <span aria-hidden="true">◷</span> Horarios
                <small>Próximamente</small>
            </button>

            <button class="nav-item" disabled>
                <span aria-hidden="true">▤</span> Cotizaciones
                <small>Próximamente</small>
            </button>
        </nav>

        <div class="sidebar-footer">
            <span class="status-dot"></span>
            Tu próxima idea empieza aquí
        </div>
    </aside>

    <main class="main-panel">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
