{% if proveedores_sociales %}<div class="acceso-social" aria-label="Otras formas de ingresar"><p class="nota">También puedes continuar con tu cuenta de:</p>{% for proveedor in proveedores_sociales %}<form method="post" action="{% url 'cuentas:social_iniciar' proveedor.codigo %}">{% csrf_token %}<button type="submit" class="boton secundario ancho">Continuar con {{ proveedor.nombre }}</button></form>{% endfor %}</div>{% endif %}
