<details class="menu-cuenta"><summary>{% if user.avatar %}<img class="cuenta-avatar cuenta-avatar-img" src="{% url 'cuentas:avatar_imagen' user.uuid %}?v={{ user.avatar_version }}" alt="" width="36" height="36">{% else %}<span class="cuenta-avatar" aria-hidden="true">{{ user.nombre|first|upper }}{{ user.apellido|first|upper }}</span>{% endif %}<span class="cuenta-identidad"><strong>{{ user.get_full_name }}</strong><small>Mi cuenta y configuración</small></span><span aria-hidden="true">⋯</span></summary>
<div class="menu-cuenta-opciones"><a href="{% url 'cuentas:perfil' %}">Mi perfil</a><a href="{% url 'cuentas:mi_contrasena' %}">Cambiar contraseña</a>{% if user.es_tatuadora %}<a href="{% url 'nucleo:portafolio' %}">Mi portafolio</a>{% endif %}<form method="post" action="{% url 'cuentas:logout' %}">{% csrf_token %}<button type="submit">Cambiar de cuenta</button><button type="submit">Cerrar sesión</button></form></div></details>
